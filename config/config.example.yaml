# flowagent 服务配置示例
# 复制本文件为 config/config.yaml 后按需修改。
# config/config.yaml 已被 .gitignore 忽略，不会提交到仓库。

server:
  port: 8080           # HTTP 监听端口
  mode: release        # gin 运行模式: debug / release / test

database:
  driver: mysql        # 数据库驱动: mysql / sqlite（默认 mysql）
  host: 127.0.0.1      # MySQL 地址
  port: 3306           # MySQL 端口
  user: root           # 用户名
  password: "your_password"   # 密码（请勿提交真实密码）
  dbname: flowagent    # 数据库名
  charset: utf8mb4     # 字符集

log:
  level: info          # 日志级别: debug / info / warn / error
  file: "logs/flowagent.log"    # 日志文件路径，为空则输出到 stdout

stream:
  callback_url: "http://127.0.0.1:8080"   # scheduler 回调 server 的根地址（不含路径）
  callback_token: ""                        # 内部事件鉴权 token，为空则不校验

workspace:
  root: "./workspace"     # 工作区根目录：工作流子任务的文件工具都落在这里，路径被沙箱约束其下
